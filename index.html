<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SANDTRIS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171512;
      --panel: #211e19;
      --line: #3a2f20;
      --text: #edf2f7;
      --muted: #c3ad8a;
      --accent: #f2d38a;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 15%, rgba(217, 180, 111, 0.12), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(88, 196, 221, 0.08), transparent 26%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100vw, 980px);
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 480px) minmax(220px, 300px);
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .stage {
      display: grid;
      place-items: center;
    }

    canvas {
      width: min(92vw, 460px);
      height: auto;
      max-height: calc(100vh - 40px);
      image-rendering: pixelated;
      border: 1px solid var(--line);
      background: #07090c;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.38);
    }

    aside {
      align-self: center;
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      background: rgba(27, 32, 40, 0.92);
      border-radius: 8px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat {
      min-height: 60px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.035);
    }

    .label {
      color: var(--muted);
      font-size: 12px;
    }

    .value {
      margin-top: 4px;
      font-weight: 700;
      font-size: 22px;
    }

    .next-preview {
      display: block;
      width: 76px;
      height: 58px;
      margin-top: 6px;
      image-rendering: pixelated;
    }

    .help {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .touch-pad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #2a251e;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover {
      border-color: var(--accent);
    }

    .status {
      min-height: 44px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(0, 0, 0, 0.18);
      font-size: 13px;
      line-height: 1.35;
    }

    @media (max-width: 760px) {
      body {
        place-items: start center;
      }

      main {
        min-height: 100svh;
        grid-template-columns: 1fr;
        align-content: start;
        gap: 8px;
        padding: 8px;
      }

      .stage canvas {
        width: auto;
        height: min(58svh, 520px);
        max-width: 92vw;
        max-height: none;
      }

      aside {
        width: min(92vw, 460px);
        gap: 6px;
        padding: 8px;
      }

      h1 {
        font-size: 18px;
      }

      .stat-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
      }

      .stat {
        min-height: 44px;
        padding: 6px;
      }

      .label {
        font-size: 11px;
      }

      .value {
        margin-top: 2px;
        font-size: 18px;
      }

      .next-preview {
        width: 44px;
        height: 32px;
        margin-top: 2px;
      }

      .help {
        font-size: 12px;
        line-height: 1.35;
      }

      .touch-pad,
      .buttons {
        gap: 6px;
      }

      button {
        min-height: 44px;
      }

      .status {
        min-height: 34px;
        padding: 8px;
        font-size: 12px;
      }
    }

    @media (max-width: 760px) and (max-height: 740px) {
      .stage canvas {
        height: 48svh;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="game stage">
      <canvas id="game" width="360" height="720"></canvas>
    </section>
    <aside>
      <h1>SANDTRIS</h1>
      <div class="stat-grid">
        <div class="stat">
          <div class="label">Score</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="stat">
          <div class="label">Chain</div>
          <div class="value" id="chain">0</div>
        </div>
        <div class="stat">
          <div class="label">Level</div>
          <div class="value" id="level">1</div>
        </div>
        <div class="stat">
          <div class="label">Next</div>
          <canvas class="next-preview" id="next" width="76" height="58" aria-label="next block preview"></canvas>
        </div>
      </div>
      <p class="help">Enter / Space / クリックで開始。プレイ中: ←→ 移動 / ↑ 回転 / ↓ 加速 / Space 即落下 / P 一時停止</p>
      <div class="touch-pad" aria-label="touch controls">
        <button data-action="left" title="Move left">←</button>
        <button data-action="down" title="Soft drop">↓</button>
        <button data-action="rotate" title="Rotate">↻</button>
        <button data-action="right" title="Move right">→</button>
        <button data-action="drop" title="Hard drop">⤓</button>
      </div>
      <div class="buttons">
        <button id="restart">Restart</button>
        <button id="pause">Pause</button>
      </div>
      <div class="status" id="status">ブロックを置くと砂に崩れ、同じ色が左右につながると消えます。</div>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const nextCanvas = document.getElementById("next");
    const nextCtx = nextCanvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const chainEl = document.getElementById("chain");
    const levelEl = document.getElementById("level");
    const statusEl = document.getElementById("status");

    const W = 120;
    const H = 240;
    const CELL = 3;
    const BW = 10;
    const BH = 20;
    const GRAIN = W / BW;
    const TICK_MS = 1000 / 60;
    const FLASH_FRAMES = 8;
    const FLASH_PHASES = 4;

    const COLORS = {
      I: "#1687ff",
      O: "#ffd21a",
      T: "#ff3045",
      S: "#00d084",
      Z: "#ff3045",
      J: "#1687ff",
      L: "#ffd21a"
    };

    const SHAPES = {
      I: [[0, 1], [1, 1], [2, 1], [3, 1]],
      O: [[1, 0], [2, 0], [1, 1], [2, 1]],
      T: [[1, 0], [0, 1], [1, 1], [2, 1]],
      S: [[1, 0], [2, 0], [0, 1], [1, 1]],
      Z: [[0, 0], [1, 0], [1, 1], [2, 1]],
      J: [[0, 0], [0, 1], [1, 1], [2, 1]],
      L: [[2, 0], [0, 1], [1, 1], [2, 1]]
    };

    const TYPES = Object.keys(SHAPES);
    let grid;
    let piece;
    let nextType;
    let score;
    let chain;
    let level;
    let settledFrames;
    let dropTimer;
    let paused;
    let over;
    let lastTime;
    let clearFlash;
    let gameState;
    let demoTimer;
    let demoAge;
    let demoTargetX;
    let demoRotateTimer;

    function makeGrid() {
      return Array.from({ length: H }, () => Array(W).fill(null));
    }

    function randType() {
      return TYPES[Math.floor(Math.random() * TYPES.length)];
    }

    function reset() {
      grid = makeGrid();
      score = 0;
      chain = 0;
      level = 1;
      settledFrames = 0;
      dropTimer = 0;
      paused = false;
      over = false;
      clearFlash = null;
      demoTimer = 0;
      demoAge = 0;
      demoTargetX = 3;
      demoRotateTimer = 0;
      nextType = randType();
      spawnPiece();
      updateHud();
    }

    function showTitle() {
      gameState = "title";
      reset();
      setStatus("SANDTRIS: ブロックは砂に崩れ、左右につながると消えます。");
      document.getElementById("restart").textContent = "Start";
      document.getElementById("pause").textContent = "Pause";
    }

    function startGame() {
      gameState = "playing";
      reset();
      setStatus("ブロックを置くと砂に崩れ、同じ色が左右につながると消えます。");
      document.getElementById("restart").textContent = "Restart";
      document.getElementById("pause").textContent = "Pause";
    }

    function spawnPiece() {
      const type = nextType || randType();
      nextType = randType();
      piece = {
        type,
        color: COLORS[type],
        cells: SHAPES[type].map(([x, y]) => ({ x, y })),
        x: 3,
        y: 0
      };
      if (collides(piece, 0, 0, piece.cells)) {
        if (gameState === "title") {
          reset();
        } else {
          over = true;
          setStatus("Game Over。Restartで再挑戦できます。");
        }
      }
      demoTargetX = Math.floor(Math.random() * 7);
    }

    function rotatedCells(cells) {
      return cells.map(({ x, y }) => ({ x: 2 - y, y: x }));
    }

    function collides(target, dx, dy, cells) {
      for (const c of cells) {
        const bx = target.x + c.x + dx;
        const by = target.y + c.y + dy;
        if (bx < 0 || bx >= BW || by >= BH) return true;
        if (by < 0) continue;
        for (let gy = by * GRAIN; gy < by * GRAIN + GRAIN; gy++) {
          for (let gx = bx * GRAIN; gx < bx * GRAIN + GRAIN; gx++) {
            if (grid[gy]?.[gx]) return true;
          }
        }
      }
      return false;
    }

    function move(dx, dy) {
      if (gameState !== "playing" || paused || over || clearFlash) return false;
      if (!collides(piece, dx, dy, piece.cells)) {
        piece.x += dx;
        piece.y += dy;
        return true;
      }
      if (dy > 0) lockPiece();
      return false;
    }

    function rotate() {
      if (gameState !== "playing" || paused || over || clearFlash || piece.type === "O") return;
      const cells = rotatedCells(piece.cells);
      for (const kick of [0, -1, 1, -2, 2]) {
        if (!collides(piece, kick, 0, cells)) {
          piece.x += kick;
          piece.cells = cells;
          return;
        }
      }
    }

    function hardDrop() {
      if (gameState !== "playing" || paused || over || clearFlash) return;
      while (move(0, 1)) score += 1;
      updateHud();
    }

    function lockPiece() {
      for (const c of piece.cells) {
        const bx = piece.x + c.x;
        const by = piece.y + c.y;
        scatterBlock(bx, by, piece.color);
      }
      settledFrames = 0;
      chain = 0;
      if (gameState === "playing") score += 12;
      spawnPiece();
      updateHud();
    }

    function scatterBlock(bx, by, color) {
      const sx = bx * GRAIN;
      const sy = by * GRAIN;
      for (let y = 0; y < GRAIN; y++) {
        for (let x = 0; x < GRAIN; x++) {
          if (Math.random() > 0.12) {
            const jitter = Math.random() < 0.5 ? 0 : (Math.random() < 0.5 ? -1 : 1);
            const gx = Math.max(0, Math.min(W - 1, sx + x + jitter));
            const gy = Math.max(0, Math.min(H - 1, sy + y));
            grid[gy][gx] = color;
          }
        }
      }
    }

    function stepSand() {
      let moved = false;
      const leftFirst = Math.random() < 0.5;
      for (let y = H - 2; y >= 0; y--) {
        const start = Math.random() < 0.5 ? 0 : W - 1;
        const dir = start === 0 ? 1 : -1;
        for (let scan = 0; scan < W; scan++) {
          const x = start + scan * dir;
          const color = grid[y][x];
          if (!color) continue;
          if (!grid[y + 1][x]) {
            grid[y + 1][x] = color;
            grid[y][x] = null;
            moved = true;
            continue;
          }
          const dirs = leftFirst ? [-1, 1] : [1, -1];
          for (const dx of dirs) {
            const nx = x + dx;
            if (nx >= 0 && nx < W && !grid[y + 1][nx]) {
              grid[y + 1][nx] = color;
              grid[y][x] = null;
              moved = true;
              break;
            }
          }
        }
      }
      return moved;
    }

    function findBridges() {
      const seen = Array.from({ length: H }, () => Array(W).fill(false));
      const remove = [];
      const queue = [];

      for (let y = 0; y < H; y++) {
        const color = grid[y][0];
        if (!color || seen[y][0]) continue;
        let touchesRight = false;
        const component = [];
        queue.length = 0;
        queue.push([0, y]);
        seen[y][0] = true;

        for (let i = 0; i < queue.length; i++) {
          const [x, cy] = queue[i];
          component.push([x, cy]);
          if (x === W - 1) touchesRight = true;
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = x + dx;
            const ny = cy + dy;
            if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
            if (!seen[ny][nx] && grid[ny][nx] === color) {
              seen[ny][nx] = true;
              queue.push([nx, ny]);
            }
          }
        }
        if (touchesRight) remove.push(...component);
      }
      return remove;
    }

    function clearBridges() {
      const remove = findBridges();
      if (!remove.length) return false;
      chain += 1;
      if (gameState === "playing") score += remove.length * chain;
      clearFlash = {
        cells: remove,
        keys: new Set(remove.map(([x, y]) => `${x},${y}`)),
        frame: 0
      };
      setStatus(`${chain}連鎖: ${remove.length}粒の砂が左右接続で光っています。`);
      updateHud();
      return true;
    }

    function updateClearFlash() {
      if (!clearFlash) return false;
      clearFlash.frame++;
      if (clearFlash.frame >= FLASH_FRAMES * FLASH_PHASES) {
        for (const [x, y] of clearFlash.cells) grid[y][x] = null;
        setStatus(`${chain}連鎖の砂が消えました。残った砂が落ちます。`);
        clearFlash = null;
        settledFrames = 0;
        level = 1 + Math.floor(score / 1800);
        updateHud();
      }
      return true;
    }

    function isFlashingCell(x, y) {
      if (!clearFlash || !clearFlash.keys.has(`${x},${y}`)) return false;
      const phase = Math.floor(clearFlash.frame / FLASH_FRAMES);
      return phase === 0 || phase === 2;
    }

    function update(dt) {
      if (gameState === "title") {
        updateDemo(dt);
        return;
      }
      if (paused || over) return;
      if (updateClearFlash()) return;
      dropTimer += dt;
      const dropDelay = Math.max(100, 680 - level * 45);
      if (dropTimer > dropDelay) {
        move(0, 1);
        dropTimer = 0;
      }

      let moved = false;
      for (let i = 0; i < 8; i++) moved = stepSand() || moved;
      if (moved) {
        settledFrames = 0;
      } else {
        settledFrames++;
        if (settledFrames > 12 && clearBridges()) {
          settledFrames = 0;
        }
      }
    }

    function updateDemo(dt) {
      if (updateClearFlash()) return;
      demoAge += dt;
      demoTimer += dt;
      demoRotateTimer += dt;

      if (demoAge > 40000 || over) {
        reset();
        setStatus("SANDTRIS: ブロックは砂に崩れ、左右につながると消えます。");
        return;
      }

      if (demoRotateTimer > 1600 && piece.type !== "O") {
        const cells = rotatedCells(piece.cells);
        if (!collides(piece, 0, 0, cells)) piece.cells = cells;
        demoRotateTimer = 0;
      }

      if (piece.x < demoTargetX && !collides(piece, 1, 0, piece.cells)) piece.x += 1;
      if (piece.x > demoTargetX && !collides(piece, -1, 0, piece.cells)) piece.x -= 1;

      if (demoTimer > 180) {
        if (!collides(piece, 0, 1, piece.cells)) {
          piece.y += 1;
        } else {
          for (const c of piece.cells) {
            scatterBlock(piece.x + c.x, piece.y + c.y, piece.color);
          }
          settledFrames = 0;
          chain = 0;
          spawnPiece();
        }
        demoTimer = 0;
      }

      let moved = false;
      for (let i = 0; i < 8; i++) moved = stepSand() || moved;
      if (moved) {
        settledFrames = 0;
      } else {
        settledFrames++;
        if (settledFrames > 12 && clearBridges()) settledFrames = 0;
      }
    }

    function drawGridLines() {
      ctx.strokeStyle = "rgba(255,255,255,0.045)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= BW; x++) {
        ctx.beginPath();
        ctx.moveTo(x * GRAIN * CELL + 0.5, 0);
        ctx.lineTo(x * GRAIN * CELL + 0.5, H * CELL);
        ctx.stroke();
      }
      for (let y = 0; y <= BH; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * GRAIN * CELL + 0.5);
        ctx.lineTo(W * CELL, y * GRAIN * CELL + 0.5);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#07090c";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGridLines();

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const color = grid[y][x];
          if (!color) continue;
          ctx.fillStyle = isFlashingCell(x, y) ? "#ffffff" : color;
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
      }

      if (piece && !over) {
        ctx.fillStyle = piece.color;
        ctx.strokeStyle = "rgba(255,255,255,0.55)";
        ctx.lineWidth = 2;
        for (const c of piece.cells) {
          const x = (piece.x + c.x) * GRAIN * CELL;
          const y = (piece.y + c.y) * GRAIN * CELL;
          ctx.fillRect(x + 1, y + 1, GRAIN * CELL - 2, GRAIN * CELL - 2);
          ctx.strokeRect(x + 1, y + 1, GRAIN * CELL - 2, GRAIN * CELL - 2);
        }
      }

      if (paused || over) {
        ctx.fillStyle = "rgba(0,0,0,0.62)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = over ? "#ff6b6b" : "#edf2f7";
        ctx.font = "700 34px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(over ? "GAME OVER" : "PAUSED", canvas.width / 2, canvas.height / 2);
      }

      if (gameState === "title") drawTitleOverlay();
    }

    function drawTitleOverlay() {
      ctx.fillStyle = "rgba(12, 10, 7, 0.58)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = "center";
      drawFittedText("SANDTRIS", 282, canvas.width - 32, 58, 34, "900", "#f2d38a");
      drawFittedText(
        "blocks fall, sand settles, lines vanish",
        314,
        canvas.width - 40,
        14,
        10,
        "700",
        "rgba(242, 211, 138, 0.68)"
      );

      const pulse = 0.55 + Math.sin(performance.now() / 360) * 0.28;
      drawFittedText(
        "PRESS ENTER / SPACE / TAP",
        386,
        canvas.width - 48,
        19,
        12,
        "700",
        `rgba(237, 242, 247, ${pulse})`
      );
    }

    function drawFittedText(text, y, maxWidth, startSize, minSize, weight, color) {
      let size = startSize;
      do {
        ctx.font = `${weight} ${size}px system-ui`;
        if (ctx.measureText(text).width <= maxWidth || size <= minSize) break;
        size -= 1;
      } while (size > minSize);
      ctx.fillStyle = color;
      ctx.fillText(text, canvas.width / 2, y);
    }

    function updateHud() {
      scoreEl.textContent = score;
      chainEl.textContent = chain;
      levelEl.textContent = level;
      drawNextPreview();
    }

    function drawNextPreview() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      nextCtx.fillStyle = "rgba(7,9,12,0.72)";
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextType) return;

      const cells = SHAPES[nextType];
      const minX = Math.min(...cells.map(([x]) => x));
      const maxX = Math.max(...cells.map(([x]) => x));
      const minY = Math.min(...cells.map(([, y]) => y));
      const maxY = Math.max(...cells.map(([, y]) => y));
      const size = 14;
      const shapeW = (maxX - minX + 1) * size;
      const shapeH = (maxY - minY + 1) * size;
      const offsetX = Math.floor((nextCanvas.width - shapeW) / 2);
      const offsetY = Math.floor((nextCanvas.height - shapeH) / 2);

      nextCtx.fillStyle = COLORS[nextType];
      nextCtx.strokeStyle = "rgba(255,255,255,0.55)";
      nextCtx.lineWidth = 2;
      for (const [x, y] of cells) {
        const px = offsetX + (x - minX) * size;
        const py = offsetY + (y - minY) * size;
        nextCtx.fillRect(px + 1, py + 1, size - 2, size - 2);
        nextCtx.strokeRect(px + 1, py + 1, size - 2, size - 2);
      }
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function frame(time) {
      const dt = Math.min(50, time - lastTime || TICK_MS);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    document.addEventListener("keydown", (event) => {
      if (gameState === "title" && (event.key === "Enter" || event.code === "Space")) {
        event.preventDefault();
        startGame();
        return;
      }
      if (event.key === "ArrowLeft") move(-1, 0);
      if (event.key === "ArrowRight") move(1, 0);
      if (event.key === "ArrowDown") {
        move(0, 1);
        score += 1;
        updateHud();
      }
      if (event.key === "ArrowUp") rotate();
      if (event.code === "Space") {
        event.preventDefault();
        hardDrop();
      }
      if (event.key.toLowerCase() === "p") togglePause();
    });

    function togglePause() {
      if (gameState === "title") {
        startGame();
        return;
      }
      if (over) return;
      paused = !paused;
      document.getElementById("pause").textContent = paused ? "Resume" : "Pause";
      setStatus(paused ? "一時停止中です。" : "再開しました。");
    }

    document.getElementById("restart").addEventListener("click", startGame);
    document.getElementById("pause").addEventListener("click", togglePause);
    canvas.addEventListener("pointerdown", () => {
      if (gameState === "title") startGame();
    });
    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("click", () => {
        const action = button.dataset.action;
        if (gameState === "title") {
          startGame();
          return;
        }
        if (action === "left") move(-1, 0);
        if (action === "right") move(1, 0);
        if (action === "down") move(0, 1);
        if (action === "rotate") rotate();
        if (action === "drop") hardDrop();
        updateHud();
      });
    });

    showTitle();
    requestAnimationFrame((time) => {
      lastTime = time;
      requestAnimationFrame(frame);
    });
  </script>
</body>
</html>
